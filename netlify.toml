[build]
  base = "."
  command = "node scripts/build-site.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Preserve old links while keeping platform as a separate application.
[[redirects]]
  from = "/admin/platform/*"
  to = "/platform/:splat"
  status = 301

# Keep links that include the former monorepo directory usable.
[[redirects]]
  from = "/MemberWebsocket-dev/*"
  to = "/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "public, max-age=0, must-revalidate"

# Opt-in full baseline on PR 17; production keeps the static build above.
[context.deploy-preview]
  command = "node scripts/verify-preview.mjs"

# Only this development branch serves the brand-new V2 application.
# The production branch continues to serve the existing site until data migration
# and all acceptance/security tests pass. No legacy assets are included in V2 dist.
[context."feature/supabase-v2-greenfield"]
  command = "node scripts/build-v2-site.mjs"
  publish = "dist"
