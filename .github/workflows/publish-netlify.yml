name: Publish verified master to Netlify

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-netlify.yml'
      - 'MemberWebsocket-dev/**'
      - 'scripts/**'
      - 'netlify.toml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-netlify-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETLIFY_SITE_ID: 196e1d2c-8216-4ba8-aeb9-1706660adc2b
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deployable static output
        run: |
          node --test scripts/deploy.test.mjs scripts/netlify-publish-workflow.test.mjs
          grep -Fq 'booking-multi-details-20261017-1' dist/points/index.html
          grep -Fq 'bookingById' dist/points/pointcard-ticket-overview.js
      - name: Build the exact master commit
        env:
          COMMIT_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Deploy tests deliberately rebuild dist with synthetic release IDs.
          # Only this final build may enter the retained and published bundle.
          node scripts/build-site.mjs
          short_sha="${COMMIT_REF:0:7}"
          for page in dist/index.html dist/{admin,platform,member,points,event,calendar,booking}/index.html dist/admin/workspace.html dist/booking/admin/index.html; do
            grep -Fq "data-commit=\"$short_sha\"" "$page"
          done
      - name: Retain the exact production bundle for recovery
        uses: actions/upload-artifact@v4
        with:
          name: netlify-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Require authorized Netlify deployment credentials
        shell: bash
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo '::error::NETLIFY_AUTH_TOKEN is unavailable. Configure it as a GitHub Repository Actions Secret (not a GitHub variable or a Netlify site environment variable). If set after an earlier run, start a new workflow run. The site bundle artifact is ready but production was not published.'
            exit 1
          fi
      - name: Wait for all established CI on this exact master commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 85); do
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="$GITHUB_REF_NAME" -f event=push -f head_sha="$GITHUB_SHA" -f per_page=50 > /tmp/master-ci.json
            result=0
            node scripts/check-preview-ci.mjs /tmp/master-ci.json || result=$?
            if [ "$result" = 0 ]; then exit 0; fi
            if [ "$result" != 2 ]; then echo '::error::Required CI failed; master was not published'; exit 1; fi
            sleep 20
          done
          echo '::error::Required CI did not finish; master was not published'
          exit 1
      - name: Publish the verified bundle to the existing Netlify production site
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq ' .object.sha')
          test "$current" = "$GITHUB_SHA"
          npx --yes netlify-cli@23.11.0 deploy --prod --no-build --dir=dist --site="$NETLIFY_SITE_ID" --message="verified-master-$GITHUB_SHA"
      - name: Confirm published page and JS contain the same fix
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          # Netlify deployment is atomic, but its public CDN aliases can lag the
          # deploy API. Retry all three real public-file assertions as one gate.
          for attempt in $(seq 1 30); do
            html_ok=0
            js_ok=0
            version_ok=0
            if curl -fsSL --max-time 20 --retry 2 --retry-delay 1 https://memberwebsocket-dev-netlify.netlify.app/points/ -o /tmp/verified-points.html; then
              if grep -Fq 'booking-multi-details-20261017-1' /tmp/verified-points.html; then html_ok=1; fi
              if grep -Fq "data-commit=\"$short_sha\"" /tmp/verified-points.html; then version_ok=1; fi
            fi
            if curl -fsSL --max-time 20 --retry 2 --retry-delay 1 https://memberwebsocket-dev-netlify.netlify.app/points/pointcard-ticket-overview.js -o /tmp/verified-overview.js; then
              if grep -Fq 'bookingById' /tmp/verified-overview.js; then js_ok=1; fi
            fi
            if [[ "$html_ok" == 1 && "$js_ok" == 1 && "$version_ok" == 1 ]]; then
              echo "Published production site matches master $GITHUB_SHA (attempt $attempt)"
              exit 0
            fi
            echo "Production CDN verification $attempt/30: html=$html_ok js=$js_ok commit=$version_ok"
            if (( attempt < 30 )); then sleep 5; fi
          done
          echo "::error::Published production files did not match the exact commit and point-card fix after 30 checks"
          exit 1
