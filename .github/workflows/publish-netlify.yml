name: Publish verified master to Netlify

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-netlify.yml'
      - 'MemberWebsocket-dev/**'
      - 'scripts/**'
      - 'netlify.toml'
  workflow_dispatch:

permissions:
  contents: write # advance production-fullstack tag only after all production smoke checks
  actions: read

concurrency:
  group: publish-netlify-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETLIFY_SITE_ID: 196e1d2c-8216-4ba8-aeb9-1706660adc2b
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release comparison uses an audited production tag
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deployable static output
        run: |
          node --test scripts/deploy.test.mjs scripts/netlify-publish-workflow.test.mjs
          grep -Fq 'booking-multi-details-20261017-1' dist/points/index.html
          grep -Fq 'bookingById' dist/points/pointcard-ticket-overview.js
      - name: Build the exact master commit
        env:
          COMMIT_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Deploy tests deliberately rebuild dist with synthetic release IDs.
          # Only this final build may enter the retained and published bundle.
          node scripts/build-site.mjs
          short_sha="${COMMIT_REF:0:7}"
          for page in dist/index.html dist/{admin,platform,member,points,event,calendar,booking}/index.html dist/admin/workspace.html dist/booking/admin/index.html; do
            grep -Fq "data-commit=\"$short_sha\"" "$page"
          done
      - name: Retain the exact production bundle for recovery
        uses: actions/upload-artifact@v4
        with:
          name: netlify-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Require authorized Netlify deployment credentials
        shell: bash
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo '::error::NETLIFY_AUTH_TOKEN is unavailable. Configure it as a GitHub Repository Actions Secret (not a GitHub variable or a Netlify site environment variable). If set after an earlier run, start a new workflow run. The site bundle artifact is ready but production was not published.'
            exit 1
          fi
      - name: Wait for all established CI on this exact master commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 85); do
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="$GITHUB_REF_NAME" -f event=push -f head_sha="$GITHUB_SHA" -f per_page=50 > /tmp/master-ci.json
            result=0
            node scripts/check-preview-ci.mjs /tmp/master-ci.json || result=$?
            if [ "$result" = 0 ]; then exit 0; fi
            if [ "$result" != 2 ]; then echo '::error::Required CI failed; master was not published'; exit 1; fi
            sleep 20
          done
          echo '::error::Required CI did not finish; master was not published'
          exit 1
      # Never publish the frontend when required database or Edge code has not
      # been promoted. No implicit first-run baseline: an authorized operator
      # must reconcile remote migration history and establish this tag first.
      - name: Inspect full-stack release baseline and deployment delta
        id: backend_plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if ! git fetch --no-tags origin 'refs/tags/production-fullstack:refs/tags/production-fullstack'; then
            echo '::error::Missing audited production-fullstack baseline. Reconcile Supabase history and initialize the release tag before enabling production promotion.'
            exit 1
          fi
          base=$(git rev-parse 'refs/tags/production-fullstack^{commit}')
          git merge-base --is-ancestor "$base" "$GITHUB_SHA" || {
            echo '::error::Release tag is not an ancestor of master'; exit 1;
          }
          node scripts/fullstack-release-plan.mjs "$base" "$GITHUB_SHA" > evidence/fullstack-release-plan.json
          echo "migrations=$(jq '.migrations|length' evidence/fullstack-release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "functions=$(jq '.functions|length' evidence/fullstack-release-plan.json)" >> "$GITHUB_OUTPUT"
          cat evidence/fullstack-release-plan.json
      - name: Require separate Supabase production deployment credentials
        if: steps.backend_plan.outputs.migrations != '0' || steps.backend_plan.outputs.functions != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo '::error::Missing SUPABASE_PRODUCTION_ACCESS_TOKEN'; exit 1; }
          if [ "${{ steps.backend_plan.outputs.migrations }}" != 0 ]; then
            test -n "${SUPABASE_DB_PASSWORD:-}" || { echo '::error::Missing SUPABASE_PRODUCTION_DB_PASSWORD'; exit 1; }
          fi
      - name: Install official Supabase CLI for production promotion
        if: steps.backend_plan.outputs.migrations != '0' || steps.backend_plan.outputs.functions != '0'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Preflight and apply only verified production SQL migrations
        if: steps.backend_plan.outputs.migrations != '0'
        working-directory: MemberWebsocket-dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
          PROJECT_REF: dbuquirnaskrwcamdxki
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --help | grep -Fq -- '--dry-run'
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          # Historical source vs remote migration drift must be reconciled
          # separately; never use --include-all or migration repair automatically.
          supabase db push --linked --dry-run
          supabase db push --linked --yes
      - name: Deploy only changed production Edge Functions and shared dependents
        if: steps.backend_plan.outputs.functions != '0'
        working-directory: MemberWebsocket-dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
          PROJECT_REF: dbuquirnaskrwcamdxki
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r function_name; do
            echo "Deploying verified canonical Edge Function: $function_name"
            supabase functions deploy "$function_name" --project-ref "$PROJECT_REF"
          done < <(jq -r '.functions[]' ../evidence/fullstack-release-plan.json)
      - name: Confirm changed Edge Functions appear in the target project
        if: steps.backend_plan.outputs.functions != '0'
        working-directory: MemberWebsocket-dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
          PROJECT_REF: dbuquirnaskrwcamdxki
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_REF" > /tmp/promoted-functions.txt
          while IFS= read -r function_name; do
            grep -Fq "$function_name" /tmp/promoted-functions.txt || {
              echo "::error::Published function missing: $function_name"; exit 1;
            }
          done < <(jq -r '.functions[]' ../evidence/fullstack-release-plan.json)
      - name: Retain backend promotion manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-backend-plan-${{ github.sha }}
          path: evidence/fullstack-release-plan.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish the verified bundle to the existing Netlify production site
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq ' .object.sha')
          test "$current" = "$GITHUB_SHA"
          npx --yes netlify-cli@23.11.0 deploy --prod --no-build --dir=dist --site="$NETLIFY_SITE_ID" --message="verified-master-$GITHUB_SHA"
      - name: Confirm published page and JS contain the same fix
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          # Netlify deployment is atomic, but its public CDN aliases can lag the
          # deploy API. Retry all three real public-file assertions as one gate.
          for attempt in $(seq 1 30); do
            html_ok=0
            js_ok=0
            version_ok=0
            if curl -fsSL --max-time 20 --retry 2 --retry-delay 1 https://memberwebsocket-dev-netlify.netlify.app/points/ -o /tmp/verified-points.html; then
              if grep -Fq 'booking-multi-details-20261017-1' /tmp/verified-points.html; then html_ok=1; fi
              if grep -Fq "data-commit=\"$short_sha\"" /tmp/verified-points.html; then version_ok=1; fi
            fi
            if curl -fsSL --max-time 20 --retry 2 --retry-delay 1 https://memberwebsocket-dev-netlify.netlify.app/points/pointcard-ticket-overview.js -o /tmp/verified-overview.js; then
              if grep -Fq 'bookingById' /tmp/verified-overview.js; then js_ok=1; fi
            fi
            if [[ "$html_ok" == 1 && "$js_ok" == 1 && "$version_ok" == 1 ]]; then
              echo "Published production site matches master $GITHUB_SHA (attempt $attempt)"
              exit 0
            fi
            echo "Production CDN verification $attempt/30: html=$html_ok js=$js_ok commit=$version_ok"
            if (( attempt < 30 )); then sleep 5; fi
          done
          echo "::error::Published production files did not match the exact commit and point-card fix after 30 checks"
          exit 1
      - name: Advance full-stack production baseline only after successful website smoke
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA"
          old=$(git rev-parse refs/tags/production-fullstack)
          git tag -f production-fullstack "$GITHUB_SHA"
          git push --force-with-lease="refs/tags/production-fullstack:$old" origin refs/tags/production-fullstack
