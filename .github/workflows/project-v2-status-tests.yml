name: Project 5 Status Contract Tests

on:
  push:
    paths:
      - scripts/project-v2-status.mjs
      - scripts/project-v2-status.test.mjs
      - .github/workflows/project-v2-status.yml
      - .github/workflows/project-v2-health.yml
      - .github/workflows/project-v2-status-tests.yml
  pull_request:
    paths:
      - scripts/project-v2-status.mjs
      - scripts/project-v2-status.test.mjs
      - .github/workflows/project-v2-status.yml
      - .github/workflows/project-v2-health.yml
      - .github/workflows/project-v2-status-tests.yml

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/project-v2-status.test.mjs
