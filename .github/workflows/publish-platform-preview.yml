name: Publish verified platform preview

on:
  push:
    branches: [feature/productization-super-admin]
    paths:
      - 'MemberWebsocket-dev/**'
      - 'scripts/**'
      - 'netlify.toml'
      - '.github/workflows/publish-platform-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-platform-preview
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/feature/productization-super-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_SITE_ID: 23796c62-480a-4b46-ac90-bfbc5ad4d300
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for all established CI on this exact commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 75); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=feature%2Fproductization-super-admin&per_page=50" > /tmp/platform-ci.json
            passed=$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .name] | unique | map(select(. == "Test MemberWebsocket Dev" or . == "Test Netlify build" or . == "MemberWebsocket Ticket Policy UI Tests")) | length' /tmp/platform-ci.json)
            if [ "$passed" = 3 ]; then exit 0; fi
            failed=$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.name == "Test MemberWebsocket Dev" or .name == "Test Netlify build" or .name == "MemberWebsocket Ticket Policy UI Tests") and (.conclusion == "failure" or .conclusion == "timed_out"))] | length' /tmp/platform-ci.json)
            if [ "$failed" != 0 ]; then echo '::error::Required CI failed; preview was not published'; exit 1; fi
            sleep 15
          done
          echo '::error::Required CI did not finish; preview was not published'
          exit 1
      - name: Build and verify the exact platform frontend
        env:
          COMMIT_REF: ${{ github.sha }}
        run: |
          node --test scripts/deploy.test.mjs scripts/netlify-publish-workflow.test.mjs
          node scripts/build-site.mjs
          test -f dist/admin/platform/index.html
          grep -Fq '2012065297-VunxFBj8' dist/config.json
      - name: Publish only the stable preview alias
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}"
          current=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/feature/productization-super-admin" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA"
          npx --yes netlify-cli@23.11.0 deploy --no-build --dir=dist --site="$NETLIFY_SITE_ID" --alias=platform --message="verified-platform-$GITHUB_SHA" --json > /tmp/platform-deploy.json
          jq '{deploy_id,deploy_url}' /tmp/platform-deploy.json
      - name: Verify preview page, assets, configuration and protected API
        shell: bash
        run: |
          set -euo pipefail
          base=https://platform--memberwebsocket-dev-netlify.netlify.app
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 20 "$base/admin/platform/" -o /tmp/platform.html && grep -Fq "data-commit=\"${GITHUB_SHA:0:7}\"" /tmp/platform.html; then break; fi
            if [ "$attempt" = 20 ]; then exit 1; fi
            sleep 5
          done
          curl -fsSL --max-time 20 "$base/admin/platform/app.js" -o /tmp/platform-app.js
          grep -Fq 'platformLiffId' /tmp/platform-app.js
          curl -fsSL --max-time 20 "$base/config.json" -o /tmp/platform-config.json
          jq -e '.platformLiffId == "2012065297-VunxFBj8"' /tmp/platform-config.json
          code=$(curl -sS --max-time 20 -o /tmp/platform-api.json -w '%{http_code}' -H "Origin: $base" -H 'Content-Type: application/json' --data '{"action":"platform.bootstrap"}' https://dbuquirnaskrwcamdxki.supabase.co/functions/v1/platform-api)
          test "$code" = 401
          jq -e '.error.code == "AUTH_REQUIRED"' /tmp/platform-api.json
