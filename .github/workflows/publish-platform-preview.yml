name: Publish verified platform preview

on:
  push:
    branches: [feature/productization-super-admin, Integrated-Marketing-Platform]
    paths:
      - 'MemberWebsocket-dev/**'
      - 'scripts/**'
      - 'netlify.toml'
      - '.github/workflows/publish-platform-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-platform-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/feature/productization-super-admin' || github.ref == 'refs/heads/Integrated-Marketing-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_SITE_ID: 23796c62-480a-4b46-ac90-bfbc5ad4d300
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PLATFORM_ALIAS: ${{ github.ref_name == 'Integrated-Marketing-Platform' && 'integrated-marketing-platform' || 'platform' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require every actual CI test lane for this exact commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 75); do
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="$GITHUB_REF_NAME" -f per_page=50 > /tmp/platform-ci.json
            # Both independent workflows must have passed on this precise SHA.
            ancillary_passed=$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[]
              | select(.head_sha == $sha and .conclusion == "success")
              | select(.name == "Test Netlify build" or .name == "MemberWebsocket Ticket Policy UI Tests")
              | .name] | unique | length' /tmp/platform-ci.json)
            ancillary_failed=$(jq --arg sha "$GITHUB_SHA" '[.workflow_runs[]
              | select(.head_sha == $sha and (.name == "Test Netlify build" or .name == "MemberWebsocket Ticket Policy UI Tests"))
              | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")] | length' /tmp/platform-ci.json)
            if [ "$ancillary_failed" != 0 ]; then echo '::error::Build or ticket policy CI failed'; exit 1; fi
            full_run_id=$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[]
              | select(.head_sha == $sha and .name == "Test MemberWebsocket Dev")] | first | .id // empty' /tmp/platform-ci.json)
            if [ -n "$full_run_id" ]; then
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$full_run_id/jobs?filter=latest&per_page=100" > /tmp/platform-ci-jobs.json
              # An exact, explicit set of all six existing test lanes. No skipped,
              # cancelled, timed-out or failing lane may count as successful.
              lanes_passed=$(jq '[.jobs[]
                | select(.name == "Regression tests" or .name == "DOM integration tests"
                  or .name == "Chromium admin, member, receipt and GPS E2E"
                  or .name == "Browser JavaScript syntax"
                  or .name == "Supabase Edge Function typecheck"
                  or .name == "Static wiring and architecture checks")
                | select(.conclusion == "success") | .name] | unique | length' /tmp/platform-ci-jobs.json)
              lane_failed=$(jq '[.jobs[]
                | select(.name == "Regression tests" or .name == "DOM integration tests"
                  or .name == "Chromium admin, member, receipt and GPS E2E"
                  or .name == "Browser JavaScript syntax"
                  or .name == "Supabase Edge Function typecheck"
                  or .name == "Static wiring and architecture checks")
                | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length' /tmp/platform-ci-jobs.json)
              if [ "$lane_failed" != 0 ]; then echo '::error::A required test lane failed'; exit 1; fi
              full_conclusion=$(jq -r --argjson id "$full_run_id" '.workflow_runs[]
                | select(.id == $id) | .conclusion // empty' /tmp/platform-ci.json)
              validator_no_runner=$(jq '[.jobs[]
                | select(.name == "Validate MemberWebsocket Dev" and .conclusion == "failure"
                  and (.runner_id == 0 or .runner_id == null)
                  and ((.steps // []) | length == 0))] | length' /tmp/platform-ci-jobs.json)
              validator_passed=$(jq '[.jobs[]
                | select(.name == "Validate MemberWebsocket Dev" and .conclusion == "success")] | length' /tmp/platform-ci-jobs.json)
              if [ "$ancillary_passed" = 2 ] && [ "$lanes_passed" = 6 ]; then
                if [ "$full_conclusion" = success ] && [ "$validator_passed" = 1 ]; then
                  echo 'All six lanes and three required workflows passed'; exit 0
                fi
                # GitHub sometimes reports the redundant summary job as failed
                # before provisioning any runner. The exact six real lane results
                # remain the authoritative acceptance evidence. A validation
                # script failure *with a runner* is never bypassed.
                if [ "$full_conclusion" = failure ] && [ "$validator_no_runner" = 1 ]; then
                  echo '::warning::Summary job failed before obtaining a runner; all six real test lanes and both independent workflows passed'
                  exit 0
                fi
              fi
              if [ "$full_conclusion" = failure ] && [ "$validator_no_runner" != 1 ]; then
                echo '::error::CI validator failed after running; preview was not published'; exit 1
              fi
            fi
            sleep 15
          done
          echo '::error::Required CI did not complete; preview was not published'
          exit 1
      - name: Build and verify the exact platform frontend
        env:
          COMMIT_REF: ${{ github.sha }}
        run: |
          node --test scripts/deploy.test.mjs scripts/netlify-publish-workflow.test.mjs
          node scripts/build-site.mjs
          test -f dist/platform/index.html
          test ! -e dist/admin/platform/index.html
          grep -Fq '2012065297-VunxFBj8' dist/config.json
          printf '/ /platform/ 302\n/admin/platform/* /platform/:splat 301\n' > dist/_redirects
      - name: Publish only the stable preview alias
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_AUTH_TOKEN:-}"
          current=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA"
          npx --yes netlify-cli@23.11.0 deploy --no-build --dir=dist --site="$NETLIFY_SITE_ID" --alias="$PLATFORM_ALIAS" --message="verified-platform-$GITHUB_SHA" --json > /tmp/platform-deploy.json
          jq '{deploy_id,deploy_url}' /tmp/platform-deploy.json
      - name: Verify preview page, assets, configuration and protected API
        shell: bash
        run: |
          set -euo pipefail
          base="https://${PLATFORM_ALIAS}--memberwebsocket-dev-netlify.netlify.app"
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 20 "$base/platform/" -o /tmp/platform.html && grep -Fq "data-commit=\"${GITHUB_SHA:0:7}\"" /tmp/platform.html; then break; fi
            if [ "$attempt" = 20 ]; then exit 1; fi
            sleep 5
          done
          curl -fsSL --max-time 20 "$base/platform/app.js" -o /tmp/platform-app.js
          grep -Fq 'platformLiffId' /tmp/platform-app.js
          curl -fsSL --max-time 20 "$base/config.json" -o /tmp/platform-config.json
          jq -e '.platformLiffId == "2012065297-VunxFBj8"' /tmp/platform-config.json
          code=$(curl -sS --max-time 20 -o /tmp/platform-api.json -w '%{http_code}' -H "Origin: $base" -H 'Content-Type: application/json' --data '{"action":"platform.bootstrap"}' https://dbuquirnaskrwcamdxki.supabase.co/functions/v1/platform-api)
          test "$code" = 401
          jq -e '.error.code == "AUTH_REQUIRED"' /tmp/platform-api.json
