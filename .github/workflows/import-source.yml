name: Import pinned MemberWebsocket source
on:
  push:
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Copy the verified source directory and deployment files
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/member-source"
          git -C "$RUNNER_TEMP/member-source" remote add origin https://github.com/yongshengchen0615/yongshengchen0615.github.io.git
          git -C "$RUNNER_TEMP/member-source" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/member-source" sparse-checkout set MemberWebsocket-dev
          git -C "$RUNNER_TEMP/member-source" fetch --depth=1 origin c1eb08e26a63862d88d91e57a4eda52a11246e5b
          git -C "$RUNNER_TEMP/member-source" checkout --detach FETCH_HEAD
          cp -a "$RUNNER_TEMP/member-source/MemberWebsocket-dev" ./MemberWebsocket-dev
          python3 - <<'PYDATA'
          import base64,json
          from pathlib import Path
          files=json.loads(base64.b64decode(""))
          for name,content in files.items():
              target=Path(name)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content)
          PYDATA
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MemberWebsocket-dev .gitignore netlify.toml README.md scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import MemberWebsocket-dev from c1eb08e26a63862d88d91e57a4eda52a11246e5b'
          git push origin HEAD:main
