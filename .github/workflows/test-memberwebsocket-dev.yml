          | xargs -n1 -P4 node --check

  postgres-integration:
    name: PostgreSQL 17 transactions and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MemberWebsocket-dev/tests/integration/package-lock.json
      - name: Install pinned PostgreSQL test client
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: MemberWebsocket-dev/tests/integration
      - name: Test isolated database migrations, physical sessions and backup restore
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          node --test --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=postgres-results.xml
          MemberWebsocket-dev/tests/integration/postgres/booking-risk.cjs
      - name: Save PostgreSQL acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-transactions-${{ github.run_attempt }}
          path: postgres-results.xml
          retention-days: 7
          if-no-files-found: error

