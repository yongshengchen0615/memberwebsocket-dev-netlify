name: Test MemberWebsocket Dev

on:
  push:
    paths:
      - 'MemberWebsocket-dev/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'docs/DEVELOPMENT_GUARDRAILS.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'netlify.toml'
      - '.github/workflows/publish-netlify.yml'
      - '.github/workflows/publish-platform-preview.yml'
      - '.github/workflows/test-netlify-build.yml'
      - '.github/workflows/test-memberwebsocket-dev.yml'
  pull_request:

permissions:
  contents: read

# Normalize push and PR branch names so the same change does not run the full suite twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run application regression tests
        run: >-
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=regression-results.xml
          MemberWebsocket-dev/tests/*.test.js
      - name: Verify governance workflow gates
        run: node --test scripts/governance-workflow.test.mjs
      - name: Save regression diagnostics and durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memberwebsocket-regression-${{ github.run_attempt }}
          path: regression-results.xml
          retention-days: 7
          if-no-files-found: warn

  integration:
    name: DOM integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: MemberWebsocket-dev/tests/integration/package-lock.json
      - name: Install DOM integration test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
