  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit browser and integration dependency trees
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix MemberWebsocket-dev/tests/browser
          npm ci --ignore-scripts --no-audit --no-fund --prefix MemberWebsocket-dev/tests/integration
          npm audit --prefix MemberWebsocket-dev/tests/browser --audit-level=low
          npm audit --prefix MemberWebsocket-dev/tests/integration --audit-level=low

  validate:
    name: Validate MemberWebsocket Dev
    if: always()
    needs: [regression, integration, postgres-integration, browser-e2e, browser-syntax, edge-functions, wiring, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test lane to pass
        env:
          REGRESSION: ${{ needs.regression.result }}
          INTEGRATION: ${{ needs.integration.result }}
          POSTGRES_INTEGRATION: ${{ needs.postgres-integration.result }}
          BROWSER_SYNTAX: ${{ needs.browser-syntax.result }}
          BROWSER_E2E: ${{ needs.browser-e2e.result }}
          EDGE_FUNCTIONS: ${{ needs.edge-functions.result }}
          WIRING: ${{ needs.wiring.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          printf 'regression=%s\nintegration=%s\nbrowser-syntax=%s\nedge-functions=%s\nwiring=%s\n' \
            "$REGRESSION" "$INTEGRATION" "$BROWSER_SYNTAX" "$EDGE_FUNCTIONS" "$WIRING"
          test "$REGRESSION" = success
          test "$INTEGRATION" = success
          test "$POSTGRES_INTEGRATION" = success
          test "$BROWSER_SYNTAX" = success
          test "$BROWSER_E2E" = success
          test "$EDGE_FUNCTIONS" = success
          test "$WIRING" = success
          test "$DEPENDENCY_AUDIT" = success
