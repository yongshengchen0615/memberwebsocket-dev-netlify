name: Test Netlify build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject retired API routes in all publishable builds
        run: node --test scripts/development-api-build.test.mjs
      - name: Verify pinned browser CI runtime
        run: node --test scripts/ci-browser-environment.test.mjs
      - name: Verify branch database isolation and master release gate
        run: node --test scripts/branch-environment.test.mjs
      - run: node --test scripts/preview-member-runtime.test.mjs scripts/preview-target.test.mjs scripts/deploy.test.mjs scripts/netlify-publish-workflow.test.mjs scripts/check-preview-ci.test.mjs scripts/project5-restore-observation.test.mjs scripts/verify-platform-preview.test.mjs scripts/inspect-preview-source.test.mjs scripts/netlify-preview-source.test.mjs scripts/netlify-native-ci-gate.test.mjs scripts/verify-netlify-native-preview.test.mjs scripts/verify-netlify-cli-preview.test.mjs
      - name: Verify the Integrated-Marketing-Platform build contract on every branch
        run: node --test scripts/deploy.test.mjs
        env:
          BRANCH: Integrated-Marketing-Platform
          CONTEXT: branch-deploy
      - name: Test PR risk, quality and regression requirements
        run: node --test scripts/pr-change-risk.test.mjs

