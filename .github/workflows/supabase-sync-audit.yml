name: Supabase production source audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - 'MemberWebsocket-dev/supabase/**'
      - 'scripts/check-supabase-sync*'
      - '.github/workflows/supabase-sync-audit.yml'
  pull_request:
    paths:
      - 'MemberWebsocket-dev/supabase/**'
      - 'scripts/check-supabase-sync*'
      - '.github/workflows/supabase-sync-audit.yml'

permissions:
  contents: read

concurrency:
  group: supabase-sync-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-tests:
    name: Check the audit parser (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/check-supabase-sync.test.mjs

  production-readonly-audit:
    name: Compare GitHub and live Supabase migrations
    needs: parser-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: dbuquirnaskrwcamdxki
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require credentials for read-only remote audit
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo '::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository Actions secrets.'
            exit 1
          fi
      - name: Link working copy to existing production project
        working-directory: MemberWebsocket-dev
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Compare migration version history (never apply schema changes)
        shell: bash
        working-directory: MemberWebsocket-dev
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "$RUNNER_TEMP/supabase-migration-list.txt"
          node ../scripts/check-supabase-sync.mjs "$RUNNER_TEMP/supabase-migration-list.txt"
