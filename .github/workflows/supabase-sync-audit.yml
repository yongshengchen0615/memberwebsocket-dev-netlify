name: Supabase migration drift audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - 'MemberWebsocket-dev/supabase/migrations/**'
      - 'scripts/check-supabase-sync*'
      - '.github/workflows/supabase-sync-audit.yml'
  pull_request:
    paths:
      - 'MemberWebsocket-dev/supabase/migrations/**'
      - 'scripts/check-supabase-sync*'
      - '.github/workflows/supabase-sync-audit.yml'

permissions:
  contents: read

concurrency:
  group: supabase-migration-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-tests:
    name: Test read-only migration comparison (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/check-supabase-sync.test.mjs

  production-readonly-audit:
    name: Compare GitHub with Supabase applied migrations
    needs: parser-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dbuquirnaskrwcamdxki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify read-only PAT is configured
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo '::error::Add a project-scoped SUPABASE_ACCESS_TOKEN with only Migrations Read permission as a GitHub Actions repository secret.'
            exit 1
          fi
      - name: Fetch remote migration history (GET only) and compare
        run: node scripts/check-supabase-sync.mjs
