name: Recover verified native platform preview
on:
  push:
    branches: [chore/platform-deploy-diagnostic-20261105]
    paths: [.github/workflows/diagnose-platform-deploy.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d8818f5d2832598f6e0f40070425ea4784ae3a7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retry the exact verified native branch from Git without ZIP or settings changes
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {awaitVerifiedPreviewCI} from './scripts/netlify-native-ci-gate.mjs';
          const siteId='196e1d2c-8216-4ba8-aeb9-1706660adc2b';
          const branch='Integrated-Marketing-Platform';
          const sha='8d8818f5d2832598f6e0f40070425ea4784ae3a7';
          const github=async path=>{
            const r=await fetch('https://api.github.com/repos/yongshengchen0615/memberwebsocket-dev-netlify'+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw new Error('GitHub read HTTP '+r.status);
            return r.json();
          };
          const head=await github('/git/ref/heads/'+branch);
          if(head.object.sha!==sha)throw new Error('Branch moved; no build started');
          const ci=await awaitVerifiedPreviewCI({sha,token:process.env.GH_TOKEN,attempts:1});
          const request=async(path,options={})=>{
            const r=await fetch('https://api.netlify.com/api/v1'+path,{...options,headers:{Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN,...options.headers},redirect:'error',signal:AbortSignal.timeout(30000)});
            if(!r.ok)throw new Error('Netlify HTTP '+r.status);
            return r.json();
          };
          const before=await request('/sites/'+siteId);
          if(before.id!==siteId||before.name!=='memberwebsocket-dev-netlify'||before.build_settings.repo_path!=='yongshengchen0615/memberwebsocket-dev-netlify'||before.build_settings.repo_branch===branch)throw new Error('Unexpected site or production identity');
          const deploys=await request('/sites/'+siteId+'/deploys?per_page=30');
          if(deploys.some(d=>d.branch===branch&&d.context==='branch-deploy'&&!['ready','error','rejected','canceled'].includes(d.state)))throw new Error('A native build is already active');
          const query=new URLSearchParams({branch,commit_sha:sha,title:'verified-native-retry-'+sha});
          const build=await request('/sites/'+siteId+'/builds?'+query,{method:'POST'});
          const id=build.deploy_id;
          if(!/^[a-f0-9]{24}$/.test(id||''))throw new Error('Build response missing deploy identity; do not retry POST');
          console.log(JSON.stringify({buildId:build.id,deployId:id,source:sha,ciRuns:ci.runIds,productionBefore:before.published_deploy.id}));
          for(let attempt=0;attempt<35;attempt++){
            const d=await request('/deploys/'+id);
            if(d.site_id!==siteId||d.branch!==branch||d.context!=='branch-deploy'||(d.commit_ref&&d.commit_ref!==sha))throw new Error('Build identity mismatch');
            if(['error','rejected','canceled'].includes(d.state))throw new Error('Native build failed: '+id);
            if(d.state==='ready'){
              const after=await request('/sites/'+siteId);
              if(after.published_deploy.id!==before.published_deploy.id||after.build_settings.repo_branch!==before.build_settings.repo_branch)throw new Error('Production identity changed');
              console.log(JSON.stringify({deployId:id,state:d.state,sha:d.commit_ref,branch:d.branch,productionUnchanged:true}));
              process.exit(0);
            }
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          throw new Error('Native build still pending: '+id);
          NODE
