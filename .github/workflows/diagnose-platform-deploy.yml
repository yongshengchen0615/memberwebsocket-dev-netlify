name: Diagnose platform deploy logs
on:
  push:
    branches: [chore/platform-deploy-diagnostic-20261105]
    paths: [.github/workflows/diagnose-platform-deploy.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read and classify only the two failed deploy logs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const site='196e1d2c-8216-4ba8-aeb9-1706660adc2b';
          const ids=['6aec680bc7445f9f186ecd08','6aec69b448b4150030e49571'];
          const token=process.env.NETLIFY_AUTH_TOKEN;
          if(!token)throw new Error('Missing existing deployment credential');
          const get=async path=>{
            const r=await fetch('https://api.netlify.com/api/v1'+path,{headers:{Authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(20000)});
            return {status:r.status,text:await r.text()};
          };
          for(const id of ids){
            const meta=await get('/deploys/'+id);
            if(meta.status!==200)throw new Error('Deploy metadata HTTP '+meta.status);
            const d=JSON.parse(meta.text);
            if(d.site_id!==site||d.context!=='branch-deploy'||d.branch!=='Integrated-Marketing-Platform')throw new Error('Unexpected deploy scope');
            const auth=await fetch('https://app.netlify.com/access-control/generate-access-control-token?'+new URLSearchParams({site_id:site,deploy_id:id}),{headers:{Authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(20000)});
            if(auth.status!==200){console.log(JSON.stringify({deploy:id,logAuthHttp:auth.status}));continue;}
            const access=(await auth.json()).accessControlToken;
            if(typeof access!=='string')throw new Error('Missing log access response');
            const collected=await new Promise(resolve=>{
              const rows=[],ws=new WebSocket('wss://socketeer.services.netlify.com/build/logs');
              const timer=setTimeout(()=>{ws.close();resolve(rows);},12000);
              ws.addEventListener('open',()=>ws.send(JSON.stringify({site_id:site,deploy_id:id,access_token:access})));
              ws.addEventListener('message',event=>{try{const row=JSON.parse(event.data);if(row.type==='error')rows.push('LOG_STREAM_ERROR_'+Number(row.status));else if(typeof row.message==='string')rows.push(row.message);}catch{}});
              ws.addEventListener('error',()=>{clearTimeout(timer);resolve(rows.concat('LOG_STREAM_UNAVAILABLE'));});
              ws.addEventListener('close',()=>{clearTimeout(timer);resolve(rows);});
            });
            const log={status:auth.status,text:JSON.stringify(collected)};
            const s=log.text;
            const codes=[...new Set(s.match(/CI_[A-Z_]+(?:[0-9]{3})?|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND|ENOENT|COMMAND_NOT_FOUND|Cannot find module[^\r\n]{0,160}|Cannot find package[^\r\n]{0,160}|command not found[^\r\n]{0,160}|Missing script[^\r\n]{0,120}/g)||[])];
            const selected=[];
            let parsed;try{parsed=JSON.parse(s);}catch{}
            const messages=Array.isArray(parsed)?parsed.map(x=>typeof x==='string'?x:x.message||x.msg||x.text||''):[];
            for(const m of messages){
              if(/CI_|Cannot find|Module|command not found|Error|error|Failed|failed|build.command|Configuration error|Build command/i.test(m)){
                let safe=String(m).replaceAll(token,'[REDACTED]').replace(/(?:Bearer|Basic)\s+[^\s"']+/gi,'[REDACTED]').replace(/(?:sk_|sb_secret_|nfp_)[A-Za-z0-9_-]+/g,'[REDACTED]');
                if(!/secret|password|token|authorization|environment|apikey|api_key/i.test(safe))selected.push(safe.slice(0,300));
              }
            }
            console.log(JSON.stringify({deploy:id,metaError:d.error_message,logHttp:log.status,logBytes:s.length,codes,selected:selected.slice(-16)}));
          }
          NODE
