name: Project 5 Temporary Live Acceptance 87

# One-off branch-only gate. This file must be removed before PR #86 is merged.
on:
  push:
    branches:
      - feat/projects-v2-graphql-status-20261022
    paths:
      - .github/workflows/project-v2-live-acceptance-87.yml

permissions:
  contents: read

concurrency:
  group: project5-issue87-temporary-acceptance
  cancel-in-progress: false

jobs:
  live:
    if: github.repository == 'yongshengchen0615/memberwebsocket-dev-netlify' && github.ref == 'refs/heads/feat/projects-v2-graphql-status-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check 25 synthetic contract cases
        run: node --test scripts/project-v2-status.test.mjs
      - name: Verify Project 5 GraphQL access (read only)
        env:
          PROJECTS_V2_TOKEN: ${{ secrets.PROJECTS_V2_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: workflow_dispatch
          HEALTHCHECK: 'true'
        run: |-
          node --input-type=module -e "import { main } from './scripts/project-v2-status.mjs'; await main({ ...process.env, GITHUB_EVENT_NAME: 'workflow_dispatch' });"
      - name: Ensure test Issue 87 belongs to Project 5 (idempotent GraphQL add)
        env:
          PROJECTS_V2_TOKEN: ${{ secrets.PROJECTS_V2_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { createGraphqlClient } from './scripts/project-v2-status.mjs';
          const gql = createGraphqlClient(process.env.PROJECTS_V2_TOKEN);
          const data = await gql(`
            query TestIssueAndProject($owner:String!, $repo:String!, $issue:Int!, $project:Int!) {
              repository(owner:$owner, name:$repo) { issue(number:$issue) { id number } }
              user(login:$owner) { projectV2(number:$project) { id title } }
            }`, { owner: 'yongshengchen0615', repo: 'memberwebsocket-dev-netlify', issue: 87, project: 5 });
          const issue = data.repository?.issue;
          const project = data.user?.projectV2;
          if (issue?.number !== 87 || !issue.id || !project?.id) {
            throw Error('Expected Issue 87 and personal Project 5 are not readable');
          }
          const result = await gql(`
            mutation AddTestIssue($project:ID!, $content:ID!) {
              addProjectV2ItemById(input:{projectId:$project, contentId:$content}) { item { id } }
            }`, { project: project.id, content: issue.id });
          if (!result.addProjectV2ItemById?.item?.id) {
            throw Error('GraphQL could not confirm a Project 5 item for Issue 87');
          }
          console.log(JSON.stringify({action:'ensured_test_item',project:'yongshengchen0615/5',issue:87,itemId:result.addProjectV2ItemById.item.id}));
          const check = await gql(`
            query TestItemIdentity($item:ID!, $owner:String!, $num:Int!) {
              node(id:$item) {
                ... on ProjectV2Item {
                  id type project { id }
                  content { __typename ... on Issue { id number repository { nameWithOwner } } }
                  fieldValueByName(name:"Status") { ... on ProjectV2ItemFieldSingleSelectValue { name optionId } }
                }
              }
              user(login:$owner) {
                projectV2(number:$num) {
                  items(first:100) {
                    totalCount
                    nodes { id type content { ... on Issue { number repository { nameWithOwner } } } }
                    pageInfo { hasNextPage }
                  }
                }
              }
            }`, { item:result.addProjectV2ItemById.item.id, owner:'yongshengchen0615', num:5 });
          const items = check.user?.projectV2?.items;
          console.log(JSON.stringify({
            action:'diagnostic_test_item', node:check.node,
            firstPageCount:items?.nodes?.length, totalCount:items?.totalCount,
            firstPageMatch:items?.nodes?.filter(x => x.content?.number === 87),
            pageInfo:items?.pageInfo
          }));
          NODE
      - name: Preview Issue 87 status change (read only)
        env:
          PROJECTS_V2_TOKEN: ${{ secrets.PROJECTS_V2_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: workflow_dispatch
          ISSUE_NUMBER: '87'
          TARGET_STATUS: '開發中'
          APPLY: 'false'
        run: |-
          node --input-type=module -e "import { main } from './scripts/project-v2-status.mjs'; await main({ ...process.env, GITHUB_EVENT_NAME: 'workflow_dispatch' });"
      - name: Update Issue 87 Status to 開發中 and verify persisted value
        env:
          PROJECTS_V2_TOKEN: ${{ secrets.PROJECTS_V2_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: workflow_dispatch
          ISSUE_NUMBER: '87'
          TARGET_STATUS: '開發中'
          APPLY: 'true'
        run: |-
          node --input-type=module -e "import { main } from './scripts/project-v2-status.mjs'; await main({ ...process.env, GITHUB_EVENT_NAME: 'workflow_dispatch' });"
      - name: Independently reread Issue 87 on a separate API call
        env:
          PROJECTS_V2_TOKEN: ${{ secrets.PROJECTS_V2_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: workflow_dispatch
          ISSUE_NUMBER: '87'
          TARGET_STATUS: '開發中'
          APPLY: 'false'
        run: |-
          node --input-type=module -e "import { main } from './scripts/project-v2-status.mjs'; await main({ ...process.env, GITHUB_EVENT_NAME: 'workflow_dispatch' });"
