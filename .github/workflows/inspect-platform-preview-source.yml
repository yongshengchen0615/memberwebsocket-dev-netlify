name: Inspect platform preview source
on:
  push:
    branches: [diagnostic/netlify-release-87d3ec5]
    paths: ['.github/workflows/inspect-platform-preview-source.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only production release credential preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PRODUCTION }}
        run: |
          node --input-type=module <<'JS'
          const ref='dbuquirnaskrwcamdxki';
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(!token)throw Error('PRODUCTION_CREDENTIAL_MISSING');
          async function request(method,path,body){
            const r=await fetch('https://api.supabase.com/v1/projects/'+ref+path,{method,redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
            if(!r.ok)throw Error('PRODUCTION_PREFLIGHT_HTTP_'+r.status);
            return r.json();
          }
          const p=await request('GET','');
          if(p.id!==ref||p.status!=='ACTIVE_HEALTHY')throw Error('PRODUCTION_IDENTITY_OR_HEALTH');
          const rows=await request('POST','/database/query',{query:'SELECT 1 AS deployment_preflight;',read_only:true});
          if(!Array.isArray(rows)||rows.length!==1||rows[0].deployment_preflight!==1)throw Error('PRODUCTION_DATABASE_READ_FAILED');
          const f=await request('GET','/functions');
          if(!Array.isArray(f))throw Error('PRODUCTION_FUNCTION_LOOKUP_FAILED');
          console.log(JSON.stringify({project:ref,health:p.status,databaseReadOnly:true,functionMetadataReadable:true}));
          JS
