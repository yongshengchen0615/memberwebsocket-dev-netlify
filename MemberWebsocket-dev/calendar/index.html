  <div id="app" class="app-shell" aria-busy="true">
    <section id="loadingView" class="state-view login-loading" aria-live="polite"><h1>正在登入活動日曆</h1><p id="loadingStatus" class="login-status" role="status">正在準備安全登入…</p><div id="loadingProgress" class="login-progress" role="progressbar" aria-label="登入進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8" aria-valuetext="8%"><span id="loadingProgressBar" class="login-progress-bar"></span></div><p id="loadingProgressText" class="login-progress-value" aria-hidden="true">8%</p></section>
    <section id="errorView" class="state-view hidden" role="alert"><div class="error-mark" aria-hidden="true">!</div><p class="kicker">Calendar access</p><h1 id="errorTitle">活動日曆暫時無法載入</h1><p id="errorMessage"></p><button id="joinMemberButton" class="button button-dark hidden" type="button">前往加入會員</button><button id="retryButton" class="button button-dark" type="button">重新整理</button></section>
    <main id="calendarView" class="hidden" data-user-tour="calendar">
      <header class="topbar"><div><p class="kicker">Lumen Club / Member calendar</p><h1>活動日曆</h1><p>休假日與會員活動，都在這個月曆裡。</p></div><div class="account-menu"><span id="displayName">LINE 使用者</span></div></header>
      <section id="membershipProgress" class="membership-progress" aria-labelledby="membershipProgressTitle" aria-live="polite"><div><p class="membership-progress-kicker">Membership progress</p><h2 id="membershipProgressTitle">會員階級</h2><p data-membership-current-tier class="membership-progress-current">目前會員階級：載入中</p></div><p data-membership-summary class="membership-progress-summary">累積 0 分鐘・下一階段資料載入中</p><p data-membership-remaining class="membership-progress-remaining">正在計算升等進度</p><div data-membership-progress-track class="membership-progress-track" role="progressbar" aria-label="會員階級進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span data-membership-progress-bar></span></div></section>
      <section class="calendar-toolbar" aria-label="月曆操作"><button id="previousMonthButton" class="month-button" type="button" aria-label="上一個月">‹</button><div><p id="monthTitle" class="month-title"></p><p id="calendarSummary" class="calendar-summary" aria-live="polite">正在同步日期</p><button id="todayButton" class="text-button" type="button">回到本月</button></div><button id="nextMonthButton" class="month-button" type="button" aria-label="下一個月">›</button></section>
      <p id="calendarRangeNotice" class="calendar-range-notice hidden" role="status" aria-live="polite"></p>
      <section id="calendarGrid" class="calendar-grid" aria-label="活動日曆" aria-live="polite"></section>
      <section id="emptyView" class="empty-view hidden"><span aria-hidden="true">○</span><h2>這段期間還沒有日期</h2><p>新的休假日或活動日期，會顯示在這裡。</p></section>
      <p class="privacy-note"><span aria-hidden="true">i</span> 日曆只顯示啟用中的休假日與活動日期，不會顯示會員個人資料。</p>
    </main>
    <div id="calendarDetailModal" class="calendar-detail-modal hidden" role="dialog" aria-modal="true" aria-labelledby="calendarDetailTitle" aria-describedby="calendarDetailItems">
      <section class="calendar-detail-card">
        <button id="closeCalendarDetailButton" class="calendar-detail-close" type="button" aria-label="關閉日期說明">×</button>
        <h2 id="calendarDetailTitle">日期說明</h2>
        <p id="calendarDetailDate" class="calendar-detail-date"></p>
        <div id="calendarDetailItems" class="calendar-detail-items"></div>
