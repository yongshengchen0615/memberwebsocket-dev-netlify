<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' https://static.line-scdn.net; style-src 'self'; connect-src 'self' https://api.line.me https://access.line.me https://liff.line.me https://*.line-scdn.net https://*.supabase.co; img-src 'self' data: https://profile.line-scdn.net; frame-src https://liff-subwindow.line.me https://access.line.me; form-action https://access.line.me">
 <title>櫃檯｜預約工作台</title>
 <link rel="stylesheet" href="./styles.css?v=20261120-rejection-modal2">
 <link rel="stylesheet" href="./workspace-polish.css?v=20261120-ux2">
 <script src="../theme.js" defer></script>
 <script src="./theme-toggle.js?v=20261120-1" defer></script>
 <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
 <script src="./app.js?v=20261120-rejection-modal2" defer></script>
</head>
<body class="frontdesk-page">
 <main class="frontdesk-shell">
  <header class="frontdesk-header">
   <div class="frontdesk-header-icon" aria-hidden="true">櫃</div>
   <div class="frontdesk-header-content">
    <p class="frontdesk-kicker">FRONT DESK · 櫃檯服務</p>
    <h1 id="businessName">櫃檯預約工作台</h1>
    <p class="frontdesk-intro">依照管理員授予的權限，查看預約資訊或處理待確認預約。</p>
   </div>
   <button id="themeToggleButton" class="frontdesk-theme-toggle" type="button" aria-label="切換為暗色調" aria-pressed="false">☾ 暗色</button>
  </header>
  <p id="status" class="frontdesk-status" role="status" aria-live="polite">正在確認商家入口…</p>
  <ol id="progress" class="frontdesk-progress" aria-label="櫃檯人員申請與審核進度"></ol>
  <section id="account" class="frontdesk-account" aria-label="櫃檯身分"></section>
  <div class="frontdesk-toolbar">
   <div class="frontdesk-toolbar-title">
    <p class="frontdesk-kicker">BOOKINGS · 預約作業</p>
    <h2>預約工作清單</h2>
    <p id="bookingSummary" class="frontdesk-summary" aria-live="polite"></p>
   </div>
   <button id="refresh" class="frontdesk-refresh" type="button" aria-controls="bookings">重新整理</button>
  </div>
  <section id="bookings" class="frontdesk-bookings" aria-label="預約清單"></section>
  <p class="frontdesk-footer">預約資料僅供已獲授權的商家櫃檯人員作業使用。</p>
 </main>
</body>
</html>
