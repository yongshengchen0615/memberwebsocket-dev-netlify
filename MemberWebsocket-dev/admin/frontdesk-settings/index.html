</head>
<body>
  <main id="frontdeskSettingsPage" class="frontdesk-shell frontdesk-settings-standalone" aria-labelledby="frontdeskPageHeading">
    <header class="frontdesk-page-header">
      <div>
        <p class="frontdesk-kicker">BUSINESS / FRONTDESK</p>
        <h1 id="frontdeskPageHeading">櫃檯設定</h1>
        <p>獨立管理櫃檯 LINE 登入、預約通知與人員申請審核。</p>
      </div>
      <div class="platform-appearance account-menu" role="group" aria-label="外觀設定"></div>
    </header>
    <nav class="frontdesk-page-links" aria-label="管理導覽">
      <a href="/admin/" id="frontdeskBackToMerchants" data-business-switch="true">返回我的商家</a>
      <a href="/admin/" id="frontdeskManageBusiness" hidden>管理商家</a>
    </nav>
    <p id="frontdeskPageStatus" role="status" aria-live="polite">正在確認 LINE 身分與商家授權…</p>
    <section id="frontdeskPageGate" class="frontdesk-card" hidden aria-labelledby="frontdeskGateTitle">
      <h2 id="frontdeskGateTitle">需要確認管理員身分</h2>
      <p>只有審核通過且已獲櫃檯功能授權的商家管理員可以使用此頁面。</p>
      <button id="frontdeskPageLogin" type="button">重新使用 LINE 登入</button>
    </section>
    <section id="frontdeskPageContent" class="frontdesk-card" hidden aria-labelledby="frontdeskMerchantTitle">
      <h2 id="frontdeskMerchantTitle">櫃檯服務設定</h2>
      <p class="frontdesk-page-description">設定會與商家管理端即時共用；人員權限由伺服器逐次確認。</p>
      <div id="frontdeskSettingsRoot" data-frontdesk-settings-root></div>
    </section>
  </main>
</body>
</html>
